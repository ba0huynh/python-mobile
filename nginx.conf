# The exported web app (see Dockerfile). TLS is Dokploy's proxy's job; this
# only ever sees plain HTTP from it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Hashed bundles: the file name changes whenever the content does, so they
    # can be cached for good.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images and fonts from the export have hashed names too.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ES modules (public/maplibre-gl-worker.mjs). nginx's mime.types has no
    # `.mjs`, and a browser refuses a module worker that isn't JavaScript.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    # Single-page app: any path that is not a file is a route the app resolves
    # (/customer, /auth/login, ...). index.html is never cached so a deploy
    # reaches everyone immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
